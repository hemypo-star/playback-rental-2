# Production stack. Only `cms` publishes a port — `db` is reachable solely
# over the compose network. `cms` is the whole application now
# (docs/PLAN-next-migration.md Stage 4) — the storefront and admin that
# used to live in a separate `web` (Astro) service were folded into this
# same Next.js app in Stages 1-3, and that service was deleted along with
# apps/web once nothing needed it anymore. Run with:
#   docker compose up --build
# Dev mode (hot reload, bind mounts) overlays compose.dev.yaml on top — see
# that file's header comment.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: playback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: playback_cms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playback -d playback_cms']
      interval: 5s
      timeout: 3s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        # NEXT_PUBLIC_* is compiled into the browser bundle. The GlitchTip
        # DSN is an ingestion address (safe to expose), not an admin secret.
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://playback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playback_cms
      # Stable forever once set for real — rotating it invalidates every
      # existing session (admin logins, checkout submitToken checks).
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      # This app's own public origin — feeds cors/csrf (payload.config.ts)
      # and Next's serverActions.allowedOrigins (next.config.mjs), both kept
      # as real CSRF defenses (not migration-era cruft) in case a reverse
      # proxy/load balancer/CDN in front of this container rewrites Origin.
      WEB_URL: ${WEB_URL:?set WEB_URL in .env}
      MEDIA_STATIC_DIR: /data/media
      # Error monitoring is disabled when the DSN is empty. Browser-side
      # monitoring uses the corresponding NEXT_PUBLIC_* build args above.
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MOYSKLAD_API_TOKEN: ${MOYSKLAD_API_TOKEN:-}
      MOYSKLAD_WEBHOOK_SECRET: ${MOYSKLAD_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      # apps/cms/src/lib/security/clientIp.ts. This stack, as shipped below,
      # publishes `cms`'s port straight to the host — nothing sits in front
      # of it to overwrite X-Real-IP/X-Forwarded-For, so the correct value
      # HERE is false: trusting those headers with no proxy stripping a
      # client-supplied one would let any visitor forge their own rate-limit
      # bucket and bypass every IP-keyed limit, including admin login. Only
      # flip this to true in an environment that actually adds a reverse
      # proxy in front of this service (outside this compose file) and sets
      # those headers correctly — see clientIp.ts and apps/cms/.env.example
      # for exactly what "correctly" means.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - '${WEB_PORT:-8080}:3000'
    volumes:
      - cms_media:/data/media
    healthcheck:
      # /api/access is Payload's built-in, unauthenticated access-control
      # introspection endpoint — always 200, no login needed, so it doubles
      # as a cheap liveness probe.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/access').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Actually schedules reconcile-moysklad.ts's sync (a review found it was
  # never wired to anything — the only safety net against a missed webhook
  # was a human running `pnpm reconcile:moysklad` by hand). Unlike the
  # one-off jobs below, this has no `profiles:` — it's part of the default
  # `docker compose up` set and stays up under the same `restart:
  # unless-stopped` policy as db/cms, re-syncing on its own interval
  # (MOYSKLAD_RECONCILE_INTERVAL_MIN, default 60) for as long as the stack
  # is up. Disabled in dev — see compose.dev.yaml.
  reconcile:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://playback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playback_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      MEDIA_STATIC_DIR: /data/media
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MOYSKLAD_API_TOKEN: ${MOYSKLAD_API_TOKEN:-}
      MOYSKLAD_RECONCILE_INTERVAL_MIN: ${MOYSKLAD_RECONCILE_INTERVAL_MIN:-60}
    volumes:
      - cms_media:/data/media
    command: ['pnpm', 'reconcile:moysklad:daemon']

  # МойСклад one-off scripts — not started by `docker compose up` (profiles:
  # [jobs] excludes them from the default set). Run one-off with e.g.:
  #   docker compose run --rm sync-moysklad
  # Reuses the cms image/env (same DATABASE_URI, MOYSKLAD_* vars, media
  # volume) so a sync run sees exactly what the running app sees.
  sync-moysklad:
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://playback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playback_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      MEDIA_STATIC_DIR: /data/media
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MOYSKLAD_API_TOKEN: ${MOYSKLAD_API_TOKEN:-}
    volumes:
      - cms_media:/data/media
    command: ['pnpm', 'sync:moysklad']

  reconcile-moysklad:
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://playback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playback_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      MEDIA_STATIC_DIR: /data/media
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MOYSKLAD_API_TOKEN: ${MOYSKLAD_API_TOKEN:-}
    volumes:
      - cms_media:/data/media
    command: ['pnpm', 'reconcile:moysklad']

  register-moysklad-webhook:
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://playback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playback_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MOYSKLAD_API_TOKEN: ${MOYSKLAD_API_TOKEN:-}
      MOYSKLAD_WEBHOOK_SECRET: ${MOYSKLAD_WEBHOOK_SECRET:-}
      # The webhook target is *this* deployment's public API — WEB_URL, not
      # an internal address, since МойСклад calls it from the outside.
      WEB_URL: ${WEB_URL:?set WEB_URL in .env}
    command: ['pnpm', 'register:moysklad-webhook']

volumes:
  pgdata:
  cms_media:
