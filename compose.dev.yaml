# Dev overlay — hot reload via bind mounts, still fully containerized.
# Run with:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# External side-effect daemons are excluded from normal dev. This prevents a
# Codespace/local stack from continuously hitting the shared МойСклад account
# or sending real Telegram/MAX/VK/email notifications by accident.

services:
  reconcile:
    profiles: [jobs]

  notifications:
    profiles: [jobs]

  cms:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Safe default is false from .env.example. A developer may explicitly
      # set true to test that checkout/contact can enqueue durable local jobs;
      # the delivery worker still does not start unless the jobs profile is
      # also requested, so enabling this alone cannot send externally.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
    volumes:
      - ./apps/cms:/repo/apps/cms
      - cms_node_modules:/repo/apps/cms/node_modules
      - ./docs:/repo/docs:ro
    healthcheck:
      start_period: 40s

volumes:
  cms_node_modules:
