name: 2.0 CI

on:
  push:
    branches:
      - 2.0
      - 'chatgpt/**'
  pull_request:
    branches:
      - 2.0

permissions:
  contents: read

jobs:
  cms:
    name: CMS checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playback_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d playback_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/playback_ci
      PAYLOAD_SECRET: ci-only-placeholder-secret-not-used-in-production
      WEB_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cms...

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-only-compose-password
        run: docker compose -f compose.yaml -f compose.dev.yaml config > /dev/null

      - name: Generate Payload types
        run: pnpm --dir apps/cms generate:types

      - name: Apply database migrations
        env:
          NODE_ENV: production
          PAYLOAD_MIGRATING: 'true'
        run: pnpm --dir apps/cms payload migrate

      - name: Lint
        run: pnpm --dir apps/cms lint

      - name: Typecheck
        run: pnpm --dir apps/cms exec tsc --noEmit

      - name: Tests
        run: pnpm --dir apps/cms test

      - name: Production build
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm --dir apps/cms build 2>&1 | tee /tmp/playback-build.log
          if grep -Fq 'Dynamic filesystem access causes tracing of the whole project' /tmp/playback-build.log; then
            echo 'Next build traced the whole project because of dynamic filesystem access'
            exit 1
          fi

      - name: Production runtime smoke
        env:
          NODE_ENV: production
          NOTIFICATIONS_ENABLED: 'false'
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          (
            cd apps/cms
            exec node ./node_modules/next/dist/bin/next start
          ) > /tmp/playback-runtime.log 2>&1 &
          CMS_PID=$!
          cleanup() {
            kill "$CMS_PID" 2>/dev/null || true
            wait "$CMS_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! pnpm --dir apps/cms smoke:runtime; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-runtime.log
            exit 1
          fi

      - name: Seed disposable browser smoke data
        env:
          NODE_ENV: production
          SMOKE_ADMIN_EMAIL: smoke-admin@example.invalid
          SMOKE_ADMIN_PASSWORD: ci-smoke-only-password-2026
        run: pnpm --dir apps/cms smoke:seed

      - name: Browser, security, notifications, rate-limit, lifecycle and promo smoke
        env:
          NODE_ENV: production
          NOTIFICATIONS_ENABLED: 'true'
          NOTIFICATION_QUEUE_DIR: /tmp/playback-notification-queue
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_ADMIN_EMAIL: smoke-admin@example.invalid
          SMOKE_ADMIN_PASSWORD: ci-smoke-only-password-2026
          RATE_LIMIT_LOGIN_ACCOUNT_MAX: '2'
          RATE_LIMIT_CONTACT_EMAIL_MAX: '2'
          TELEGRAM_BOT_TOKEN: ci-telegram-secret-sentinel
          TELEGRAM_CHAT_IDS: ci-telegram-recipient-sentinel
          MAX_BOT_TOKEN: ci-max-secret-sentinel
          MAX_USER_IDS: ci-max-recipient-sentinel
          VK_ACCESS_TOKEN: ci-vk-secret-sentinel
          VK_PEER_IDS: ci-vk-recipient-sentinel
          SMTP_HOST: smtp.invalid
          SMTP_FROM: smoke-sender@example.invalid
          SMTP_ADMIN_TO: ci-admin@example.invalid
          SMTP_PASSWORD: ci-smtp-secret-sentinel
        run: |
          rm -rf "$NOTIFICATION_QUEUE_DIR"
          (
            cd apps/cms
            exec node ./node_modules/next/dist/bin/next start
          ) > /tmp/playback-browser.log 2>&1 &
          CMS_PID=$!
          cleanup() {
            kill "$CMS_PID" 2>/dev/null || true
            wait "$CMS_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! pnpm --dir apps/cms smoke:browser; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi

          if ! pnpm --dir apps/cms smoke:public-security; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi

          if ! pnpm --dir apps/cms smoke:notifications; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi

          if ! pnpm --dir apps/cms smoke:rate-auth; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi

          if ! pnpm --dir apps/cms smoke:order-lifecycle; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi

          if ! pnpm --dir apps/cms smoke:promos; then
            echo '--- Next runtime log ---'
            cat /tmp/playback-browser.log
            exit 1
          fi
