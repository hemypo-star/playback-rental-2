# Deploy blueprint for a hosted preview of 2.0 — a permanent external URL on
# free plans. Render reads this file when you point a Blueprint at the
# repository; docs/DEPLOY-PREVIEW.md has the click-path and, more importantly,
# what "free" actually costs you here.
#
# It builds the same apps/cms/Dockerfile the compose stack uses, so what runs
# here is what runs in production — one Next process serving the storefront,
# the custom /admin and Payload's own /cms.
#
# The database is deliberately NOT declared here. Render's own free Postgres
# is deleted 30 days after creation, which would quietly take the preview with
# it; DATABASE_URI is filled in from a free Neon project instead, which has no
# expiry. See the doc.
services:
  - type: web
    name: playback-rental-preview
    runtime: docker
    dockerfilePath: ./apps/cms/Dockerfile
    dockerContext: .
    plan: free
    branch: frontend-transfer-unified
    healthCheckPath: /api/access
    # Replaces the Dockerfile's CMD: same migrate-then-start, plus deriving
    # WEB_URL from the service's own URL, the first-boot seed, and re-uploading
    # demo images the free plan's disposable filesystem has dropped.
    dockerCommand: ./start-hosted.sh
    envVars:
      - key: NODE_ENV
        value: production
      # A free instance has 512MB, and Node will happily grow its heap past a
      # container limit and get OOM-killed rather than collect harder. Cap the
      # old space below the limit so V8 does the collecting instead.
      - key: NODE_OPTIONS
        value: '--max-old-space-size=384'
      # Paste a Neon connection string here in the dashboard (Render asks for
      # every sync:false value before the first deploy).
      - key: DATABASE_URI
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      # A free instance cannot mount a disk, so this is a scratch directory
      # that empties on every restart. start-hosted.sh re-uploads the demo
      # images it finds missing; images you add through the admin do not
      # survive. That is the free plan's main functional limit.
      - key: MEDIA_STATIC_DIR
        value: /tmp/media
      - key: NOTIFICATION_QUEUE_DIR
        value: /tmp/notifications
      # Render terminates TLS in front of the container, so the real client IP
      # only exists in X-Forwarded-For — the rate limiter needs this to be on
      # or it buckets every visitor together.
      - key: TRUST_PROXY_HEADERS
        value: 'true'
      # No messenger, SMTP or МойСклад credentials are set anywhere in this
      # blueprint, so a preview cannot message anyone or touch the shared
      # МойСклад account. Checkout still works; the notification is enqueued
      # and simply never delivered.
      - key: NOTIFICATIONS_ENABLED
        value: 'false'
      # Fills an empty catalog on first boot. Set it to 0 once the content is
      # yours; the demo-image repair goes away with it.
      - key: PREVIEW_SEED
        value: '1'
      - key: SMOKE_ADMIN_EMAIL
        value: demo@playback.local
      # Set this yourself in the dashboard before the first deploy — it is the
      # admin password for a publicly reachable URL, so it should not come
      # from a file in the repository.
      - key: SMOKE_ADMIN_PASSWORD
        sync: false
