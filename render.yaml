# Deploy blueprint for a hosted preview of 2.0 — a permanent external URL
# without running anything locally. Render reads this file when you point a
# Blueprint at the repository; see docs/DEPLOY-PREVIEW.md for the click-path,
# what it costs and what the free tier will and will not do.
#
# It builds the same apps/cms/Dockerfile the compose stack uses, so what runs
# here is what runs in production — one Next process serving the storefront,
# the custom /admin and Payload's own /cms.
services:
  - type: web
    name: playback-rental-preview
    runtime: docker
    dockerfilePath: ./apps/cms/Dockerfile
    dockerContext: .
    plan: starter
    branch: frontend-transfer-unified
    healthCheckPath: /api/access
    # Replaces the Dockerfile's CMD: same migrate-then-start, plus deriving
    # WEB_URL from the service's own URL and the opt-in first-boot seed.
    dockerCommand: ./start-hosted.sh
    disk:
      # Payload writes uploads to the filesystem (Media.staticDir), so without
      # a disk every image added through the admin disappears on the next
      # deploy. Small because a preview only holds what the seed uploads plus
      # whatever you add by hand.
      name: media
      mountPath: /data/media
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URI
        fromDatabase:
          name: playback-rental-preview-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: MEDIA_STATIC_DIR
        value: /data/media
      # Render terminates TLS in front of the container, so the real client IP
      # only exists in X-Forwarded-For — the rate limiter needs this to be on
      # or it buckets every visitor together.
      - key: TRUST_PROXY_HEADERS
        value: 'true'
      # No messenger, SMTP or МойСклад credentials are set anywhere in this
      # blueprint, so a preview cannot message anyone or touch the shared
      # МойСклад account. Checkout still works; the notification is enqueued
      # and simply never delivered.
      - key: NOTIFICATIONS_ENABLED
        value: 'false'
      - key: NOTIFICATION_QUEUE_DIR
        value: /data/media/.notifications
      # Fills the catalog on first boot only, then never again. Set it to 0
      # (or remove it) once you want the content to be yours.
      - key: PREVIEW_SEED
        value: '1'
      - key: SMOKE_ADMIN_EMAIL
        value: demo@playback.local
      # Set this yourself in the dashboard before the first deploy — it is the
      # admin password for a publicly reachable URL, so it should not come
      # from a file in the repository.
      - key: SMOKE_ADMIN_PASSWORD
        sync: false

databases:
  - name: playback-rental-preview-db
    databaseName: playback_cms
    user: playback
    plan: basic-256mb
